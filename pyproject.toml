[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dhan-mcp-server"
version = "0.2.0"
description = "Read-only Dhan v2 MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
dhan-mcp-server = "dhan_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["dhan_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
