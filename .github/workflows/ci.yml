name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m compileall -q dhan_mcp_server
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dhan-mcp:test .
      - run: docker run --rm dhan-mcp:test dhan-mcp-server --help
      - run: |
          docker run -d --name dhan-mcp -p 8000:8000 dhan-mcp:test
          trap 'docker logs dhan-mcp; docker rm -f dhan-mcp' EXIT
          curl --retry 15 --retry-all-errors --retry-delay 1 --max-time 5 --fail http://localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/mcp)" = 503

      - name: Verify protected OAuth container
        run: |
          docker run -d --name dhan-oauth -p 8001:8000 \
            -e MCP_AUTH_MODE=self-hosted \
            -e MCP_RESOURCE_URL=https://test.example/mcp \
            -e MCP_OWNER_PASSWORD=synthetic-ci-only-password-not-real-123 \
            -e DHAN_ACCESS_TOKEN=synthetic -e DHAN_CLIENT_ID=synthetic dhan-mcp:test
          trap 'docker logs dhan-oauth; docker rm -f dhan-oauth' EXIT
          curl --retry 15 --retry-all-errors --retry-delay 1 --max-time 5 --fail http://localhost:8001/health | grep '"mcp_enabled":true'
          curl -fsS http://localhost:8001/.well-known/oauth-authorization-server | grep 'S256'
          curl -fsS http://localhost:8001/.well-known/oauth-protected-resource/mcp | grep 'https://test.example/mcp'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Host: test.example' http://localhost:8001/mcp)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Host: test.example' -H 'Authorization: Bearer invalid' http://localhost:8001/mcp)" = 401
