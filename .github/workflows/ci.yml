name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m compileall -q dhan_mcp_server
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dhan-mcp:test .
      - run: docker run --rm dhan-mcp:test dhan-mcp-server --help
      - run: |
          docker run -d --name dhan-mcp -p 8000:8000 dhan-mcp:test
          trap 'docker logs dhan-mcp; docker rm -f dhan-mcp' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/mcp)" = 503
